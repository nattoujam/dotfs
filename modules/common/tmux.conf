set-option -g default-terminal "screen-256color"
set-option -ga terminal-features ',screen-256color:RGB'
set-option -ga terminal-overrides ',xterm-256color:Tc'

set-environment -g TZ Asia/Tokyo

set -g status-interval 5

# change prefix key -> <C-q>
set -g prefix C-q

# mouse scroll
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# display cpu, mem usage
set -g status-right '#[fg=white,bg=blue] #(~/.local/bin/tmux-cpu-mem.sh) #[fg=white,bg=green] %Y-%m-%d %H:%M'

set -g status-style 'bg=black fg=white'
set -g status-left '#[fg=cyan,bold] #S #[default]'
set -g status-justify centre
